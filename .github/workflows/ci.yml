name: App checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:check
      - run: npm run build:native
      - run: node scripts/check-public-build.mjs dist --native
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run backend:start
      - run: npm run backend:reset
      - run: npm run backend:test
      - run: npm run backend:test:api
      - run: npm run backend:test:customer
      - shell: pwsh
        run: ./scripts/backend-network.test.ps1
      - if: always()
        run: npm run backend:stop
