project_id = "dusk-foundation-local"

# Pinned CLI stack runtime explicitly binds listeners to loopback on Docker Desktop.
[experimental]
stack = true

[api]
enabled = true
port = 55321
schemas = ["api"]
extra_search_path = ["extensions"]
max_rows = 200
auto_expose_new_tables = false

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 55324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
jwt_expiry = 900
enable_refresh_token_rotation = true

[auth.email]
enabled = true
enable_confirmations = true
secure_password_change = true

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = false

[storage]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[local.services.database]
version = "17.11.0.006"
